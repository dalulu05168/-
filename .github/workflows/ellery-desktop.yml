name: Ellery desktop Windows release
on:
  push:
    branches: ['codex/ellery-desktop-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - name: Install, launch and uninstall on Windows
        shell: pwsh
        run: ./scripts/windows-install-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Ellery-Westcott-CRM-Windows
          path: |
            dist/Ellery-Westcott-CRM-Setup-*.exe
            dist/windows-acceptance/*.json
            dist/windows-acceptance/*.png
            dist/windows-acceptance/SHA256.txt
          if-no-files-found: error
          retention-days: 14
