name: Ellery desktop candidate
on:
  push:
    branches: ['codex/ellery-desktop-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Ellery-Westcott-CRM-Windows-Candidate
          path: dist/Ellery-Westcott-CRM-Setup-2.0.0.exe
          if-no-files-found: error
          retention-days: 14
