name: Login redesign visual browser QA

on:
  push:
    branches:
      - ui/login-redesign-milkwhite-20261010
  pull_request:
    paths:
      - "app.js"
      - "index.html"
      - "login-redesign.css"
      - "scripts/login-browser-qa.mjs"
      - "tests/**"
      - ".github/workflows/login-visual-qa.yml"

jobs:
  login-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app and headless browser dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
      - name: Validate JavaScript syntax and design contract
        run: |
          node --check app.js
          node --check scripts/login-browser-qa.mjs
          npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Read-only desktop and mobile login acceptance
        run: node scripts/login-browser-qa.mjs
      - name: Preserve four actual login screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-visual-qa
          path: artifacts/login/
          if-no-files-found: ignore
