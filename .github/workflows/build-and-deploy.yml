name: Build and deploy WMS

on:
  push:
    branches: [main, wmsystem]
  pull_request:
    branches: [main, wmsystem]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wmsystem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with: {}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Pages bundle
        run: pnpm run build:pages
      - name: Validate Worker syntax
        run: node --check client/dist/_worker.js
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wmsystem-pages-dist
          path: client/dist
          if-no-files-found: error
      - name: Publish to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: pnpm dlx wrangler@latest pages deploy client/dist --project-name=wmsystem --branch=main --commit-message="GitHub Actions ${{ github.sha }}"
