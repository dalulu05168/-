name: P005 Render isolated staging browser acceptance

on:
  push:
    branches:
      - deploy/render-p005-private-staging-20261011
    paths:
      - "app.js"
      - "allocation-projects.js"
      - "tests/reservation-no-fullscreen.test.mjs"
      - "tests/reservation-detail-completeness.test.mjs"
      - "ui-finance-density-20261011.css"
      - "tests/finance-density-contract.test.mjs"
      - "demo-client.js"
      - "server.js"
      - "tests/private-staging.test.mjs"
      - "scripts/staging-login-browser-qa.mjs"
      - "scripts/p005-ui-density-browser-audit.mjs"
      - ".github/workflows/render-staging-qa.yml"
  workflow_dispatch:

jobs:
  staging-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and HTTP access-control checks
        run: |
          node --check app.js
          node --check server.js
          node --check scripts/staging-login-browser-qa.mjs
          node --test tests/private-staging.test.mjs tests/reservation-no-fullscreen.test.mjs tests/reservation-detail-completeness.test.mjs tests/finance-density-contract.test.mjs
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify simulated login opens dashboard on desktop and phone
        run: node scripts/staging-login-browser-qa.mjs
      - name: Three-role all-page desktop and phone UI density audit
        run: node scripts/p005-ui-density-browser-audit.mjs
      - name: Save finance UI layout reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p005-finance-ui-density
          path: artifacts/finance-audit/
          if-no-files-found: ignore
